name: Build Executables

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: CQ-editor-linux-x86_64
            binary: target/release/cq-editor
          - os: windows-latest
            artifact: CQ-editor-windows-x86_64.exe
            binary: target/release/cq-editor.exe
          - os: macos-latest
            artifact: CQ-editor-macos-arm64
            binary: target/release/cq-editor

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev

      - name: Build
        run: cargo build --release

      - name: Rename the executable
        shell: bash
        run: mkdir dist && cp ${{ matrix.binary }} dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
