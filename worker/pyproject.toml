[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cq-editor-worker"
version = "0.8.0.dev0"
description = "CadQuery execution backend for the CQ-editor GUI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["cadquery", "numpy"]

[project.optional-dependencies]
# Code completion in the editor and the console.
completion = ["jedi"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["cq_worker*"]

[tool.pytest.ini_options]
testpaths = ["../tests/worker"]
